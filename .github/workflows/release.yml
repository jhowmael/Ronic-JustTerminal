name: Release

# Publishes the downloads to GitHub Releases when a "v*" tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Can also be triggered manually (builds the workflow artifacts only, no Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Package (universal arm64 + x86_64)
        run: UNIVERSAL=1 ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/RonicJustTerminal-macOS.zip

  windows:
    # The .exe is built on Linux (EnableWindowsTargeting): faster, same result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Package (x64)
        run: ./scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/RonicJustTerminal-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ronic JustTerminal ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Downloads
            | System | File |
            |---|---|
            | macOS 13+ (Apple Silicon and Intel) | **RonicJustTerminal-macOS.zip** |
            | Windows 10 (1809+) and 11 (64-bit) | **RonicJustTerminal-Windows.zip** |

            Installation and shortcuts: see the [README](https://github.com/jhowmael/Ronic-JustTerminal#installation).
          files: |
            dist/RonicJustTerminal-macOS.zip
            dist/RonicJustTerminal-Windows.zip
